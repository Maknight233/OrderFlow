name: CI

on:
  push:
    branches: ['**']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Finish main releases in order; a newer PR/feature commit cancels older tests.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Package all four services
        run: |
          mkdir -p target/ci
          mvn -B -ntp -DskipTests package 2>&1 | tee target/ci/package.log

      - name: Run standalone Gateway unit tests
        run: |
          mvn -B -ntp -pl gateway-service -Dtest=GatewayConcurrencyFilterTest test 2>&1 | tee target/ci/unit-tests.log

      - name: Verify read-only Docker smoke warmup regression cases
        run: |
          python3 -m unittest discover -s scripts -p 'test_docker_smoke.py' -v 2>&1 | tee target/ci/smoke-preflight-tests.log

      - name: Upload Maven reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/target/surefire-reports/**
            target/ci/**
          if-no-files-found: warn
          retention-days: 14

  scan-images:
    name: scan-images (${{ matrix.service }})
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [discovery-service, gateway-service, order-service, inventory-service]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set image name (GHCR requires lowercase)
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Generate source tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image archive without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Unpack OCI layout for Trivy
        env:
          IMAGE_DIR: ${{ runner.temp }}/image-layout
          IMAGE_ARCHIVE: ${{ runner.temp }}/image.tar
        run: |
          mkdir -p "$IMAGE_DIR"
          tar -xf "$IMAGE_ARCHIVE" -C "$IMAGE_DIR"

      - name: Scan the exact image (HIGH and CRITICAL block release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          input: ${{ runner.temp }}/image-layout
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: trivy-${{ matrix.service }}.json
          timeout: 10m

      - name: Upload security report even when the scan fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Save approved image for the main release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          # A retry of failed publish jobs can reuse successful scans from this run.
          name: scanned-image-${{ matrix.service }}-${{ github.run_id }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 3

  publish-images:
    name: publish-images (${{ matrix.service }})
    # Every service must pass scanning, and all 15 smoke checks must pass first.
    needs: [build-test, docker-smoke, scan-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [discovery-service, gateway-service, order-service, inventory-service]
    steps:
      - name: Download this run's scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scanned-image-${{ matrix.service }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release

      - name: Prepare exact OCI image for export (no application rebuild)
        id: image
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p "$RELEASE_DIR/layout"
          tar -xf "$RELEASE_DIR/image.tar" -C "$RELEASE_DIR/layout"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RELEASE_DIR'])
          manifests = json.loads((root / 'layout/index.json').read_text())['manifests']
          if len(manifests) != 1:
              raise SystemExit('Expected exactly one scanned platform image')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"digest={manifests[0]['digest']}\n")
          (root / 'Dockerfile').write_text('FROM scanned\n')
          (root / '.dockerignore').write_text('*\n')
          PY
          echo "name=ghcr.io/${REPOSITORY,,}-${SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA tag (never latest)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: type=sha,format=long

      - name: Log in to GHCR with the temporary workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Refuse to replace an existing SHA tag with different content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          IMAGE: ${{ steps.image.outputs.name }}
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          scope = 'orgs' if os.environ['OWNER_TYPE'] == 'Organization' else 'users'
          package = os.environ['IMAGE'].rsplit('/', 1)[1]
          base = f"{os.environ['API_URL']}/{scope}/{os.environ['OWNER']}/packages/container/{package}/versions"
          tag = 'sha-' + os.environ['COMMIT_SHA']
          page = 1
          while True:
              request = Request(f'{base}?per_page=100&page={page}', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
              })
              try:
                  with urlopen(request, timeout=30) as response:
                      versions = json.load(response)
              except HTTPError as error:
                  if error.code != 404:
                      raise
                  break  # Package does not yet exist; the push still requires write access.
              for version in versions:
                  if tag in version['metadata']['container']['tags']:
                      if version['name'] != os.environ['EXPECTED_DIGEST']:
                          raise SystemExit('Refusing to move an existing SHA tag. Reuse its original image or create a new commit.')
                      print('Existing SHA tag already has the scanned digest')
                      raise SystemExit(0)
              if len(versions) < 100:
                  break
              page += 1
          print('SHA tag is available for this scanned image')
          PY

      - name: Export scanned image to GHCR with SHA tag
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/release
          build-contexts: scanned=oci-layout://${{ runner.temp }}/release/layout@${{ steps.image.outputs.digest }}
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Verify digest and pull the SHA image
        env:
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          test "$EXPECTED_DIGEST" = "$PUBLISHED_DIGEST"
          docker pull "$IMAGE:sha-$COMMIT_SHA"
          test "$(docker image inspect "$IMAGE:sha-$COMMIT_SHA" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$COMMIT_SHA"
          test "$(docker image inspect "$IMAGE:sha-$COMMIT_SHA" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = "$SOURCE_URL"
          docker run --rm --entrypoint java "$IMAGE:sha-$COMMIT_SHA" -version
          owner_path=users
          if [[ "$OWNER_TYPE" == Organization ]]; then owner_path=orgs; fi
          package="${IMAGE##*/}"
          gh api "$owner_path/$OWNER/packages/container/$package" > package.json
          python3 - <<'PY'
          import json, os
          package = json.load(open('package.json'))
          if package['visibility'] != 'private':
              raise SystemExit('Expected a private GHCR package')
          linked = package.get('repository')
          if linked is not None:
              if str(linked.get('id')) != os.environ['REPOSITORY_ID']:
                  raise SystemExit(f"Unexpected linked repository ID: {linked.get('id')}")
              print('Verified linked repository ID')
          else:
              print('Package API omits repository metadata; inheritance can be reviewed in Package settings')
          print('Verified private Package, OCI source/revision and workflow token push/pull access')
          PY
          printf '%s@%s\n' "$IMAGE" "$PUBLISHED_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  promote-main:
    name: promote-main
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Promote all verified SHA images only while this commit is main HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          head_sha=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$API_URL/repos/$REPOSITORY/git/ref/heads/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          if [[ "$head_sha" != "$COMMIT_SHA" ]]; then
            echo 'Skipping main promotion: a newer commit is already main HEAD.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for service in discovery-service gateway-service order-service inventory-service; do
            image="ghcr.io/${REPOSITORY,,}-$service"
            # Preserve the single-platform manifest rather than wrapping it in an index.
            docker buildx imagetools create --prefer-index=false \
              --tag "$image:main" "$image:sha-$COMMIT_SHA"
            test "$(docker buildx imagetools inspect "$image:main" --format '{{.Manifest.Digest}}')" = \
              "$(docker buildx imagetools inspect "$image:sha-$COMMIT_SHA" --format '{{.Manifest.Digest}}')"
            printf '%s:main -> sha-%s\n' "$image" "$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
          done

  docker-smoke:
    name: docker-smoke
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      # Limit Compose engine concurrency; Dockerfiles lock their shared Maven cache.
      COMPOSE_PARALLEL_LIMIT: '1'
      BUILDKIT_PROGRESS: plain
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check runner and Compose configuration
        run: |
          mkdir -p target/ci
          {
            docker version
            docker compose version
            python3 --version
            free -h
            df -h
            docker compose --env-file .env.example config --quiet
          } 2>&1 | tee target/ci/runner.log

      - name: Build four images and run all 15 Docker smoke checks
        # SIGINT lets the script write its report and collect logs before cleanup.
        # Leave four minutes for cleanup and time for artifact upload afterward.
        run: |
          timeout --signal=INT --kill-after=240s 40m python3 -u scripts/docker-smoke.py 2>&1 | tee target/ci/docker-smoke.log

      - name: Verify complete smoke report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          reports = list(Path('integration-tests/target/docker-smoke').glob('*/report.json'))
          if len(reports) != 1:
              raise SystemExit(f'Expected one smoke report, found {len(reports)}')
          report = json.loads(reports[0].read_text())
          checks = report['checks']
          if report['status'] != 'PASS' or len(checks) != 15 or any(check['status'] != 'PASS' for check in checks):
              raise SystemExit('Docker smoke acceptance requires 15/15 PASS')
          print('Docker smoke acceptance: 15/15 PASS')
          PY

      - name: Upload Docker reports, HTTP traces and service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            integration-tests/target/docker-smoke/**
            target/ci/**
          if-no-files-found: warn
          retention-days: 14
