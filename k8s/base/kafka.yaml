apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: orderflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 29092
      targetPort: broker
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: orderflow
spec:
  clusterIP: None
  # KRaft needs its own stable DNS before the broker becomes Ready.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 29092
      targetPort: broker
    - name: controller
      port: 29093
      targetPort: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: orderflow
spec:
  serviceName: kafka-headless
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: apache/kafka:4.2.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kafka-config
          ports:
            - name: broker
              containerPort: 29092
            - name: controller
              containerPort: 29093
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "1", memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            # The vendor entrypoint generates /opt/kafka/config at startup.
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - KAFKA_HEAP_OPTS='-Xms32m -Xmx128m' /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:29092 --list
            periodSeconds: 10
            timeoutSeconds: 20
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - KAFKA_HEAP_OPTS='-Xms32m -Xmx128m' /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:29092 --list
            periodSeconds: 30
            timeoutSeconds: 20
          livenessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
