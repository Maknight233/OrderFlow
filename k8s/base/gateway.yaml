apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: orderflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway-service
  ports:
    - name: http
      port: 9000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: orderflow
  labels:
    app.kubernetes.io/component: application
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-service
        app.kubernetes.io/component: application
    spec:
      containers:
        - name: app
          image: orderflow-gateway-service
          ports:
            - name: http
              containerPort: 9000
