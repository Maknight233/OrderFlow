name: orderflow

x-java-environment: &java-environment
  SPRING_PROFILES_ACTIVE: docker
  EUREKA_URL: http://discovery-service:8761/eureka/
  TRACING_ENABLED: ${TRACING_ENABLED:-false}
  ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT:-http://host.docker.internal:9411/api/v2/spans}

x-java-service: &java-service
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  networks: [orderflow]
  extra_hosts: ["host.docker.internal:host-gateway"]

x-java-health: &java-health
  interval: 10s
  timeout: 5s
  start_period: 60s
  retries: 18

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow}
      POSTGRES_DB: orderflow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [orderflow]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d orderflow && PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d inventory_db -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks: [orderflow]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  kafka:
    image: apache/kafka:4.2.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [orderflow]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 30s
      start_period: 30s
      retries: 12

  discovery-service:
    <<: *java-service
    image: ${IMAGE_PREFIX:-orderflow}-discovery-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    environment:
      <<: *java-environment
    ports:
      - "127.0.0.1:${DISCOVERY_PORT:-8761}:8761"
    healthcheck:
      <<: *java-health
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:8761/actuator/health/readiness"]

  order-service:
    <<: *java-service
    image: ${IMAGE_PREFIX:-orderflow}-order-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      <<: *java-environment
      DB_URL: jdbc:postgresql://postgres:5432/orderflow
      DB_USERNAME: ${POSTGRES_USER:-orderflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-orderflow}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:${ORDER_PORT:-8081}:8081"
    depends_on:
      discovery-service: {condition: service_healthy}
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      <<: *java-health
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:8081/actuator/health/readiness"]

  inventory-service:
    <<: *java-service
    image: ${IMAGE_PREFIX:-orderflow}-inventory-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      <<: *java-environment
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: ${POSTGRES_USER:-orderflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-orderflow}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:${INVENTORY_PORT:-8082}:8082"
    depends_on:
      discovery-service: {condition: service_healthy}
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      <<: *java-health
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:8082/actuator/health/readiness"]

  gateway-service:
    <<: *java-service
    image: ${IMAGE_PREFIX:-orderflow}-gateway-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    environment:
      <<: *java-environment
      GATEWAY_CONNECT_TIMEOUT_MS: ${GATEWAY_CONNECT_TIMEOUT_MS:-1000}
      GATEWAY_RESPONSE_TIMEOUT: ${GATEWAY_RESPONSE_TIMEOUT:-3s}
      GATEWAY_TOTAL_TIMEOUT: ${GATEWAY_TOTAL_TIMEOUT:-7s}
      GATEWAY_GET_MAX_ATTEMPTS: ${GATEWAY_GET_MAX_ATTEMPTS:-2}
      GATEWAY_CB_MIN_CALLS: ${GATEWAY_CB_MIN_CALLS:-10}
      GATEWAY_CB_OPEN_WAIT: ${GATEWAY_CB_OPEN_WAIT:-10s}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-9000}:9000"
    depends_on:
      discovery-service: {condition: service_healthy}
      order-service: {condition: service_healthy}
      inventory-service: {condition: service_healthy}
    healthcheck:
      <<: *java-health
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:9000/actuator/health/readiness"]

networks:
  orderflow:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
