services:
  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ${PROMETHEUS_CONFIG:-./monitoring/prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/alerts-test.yml:/etc/prometheus/alerts-test.yml:ro
      - prometheus-data:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [alertmanager, blackbox]
  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-orderflow-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
  zipkin:
    image: openzipkin/zipkin:3.5.1
    ports: ["127.0.0.1:${ZIPKIN_PORT:-9411}:9411"]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports: ["127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"]
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    ports: ["127.0.0.1:${BLACKBOX_PORT:-9115}:9115"]
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
