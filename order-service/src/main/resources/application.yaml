server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orderflow
    username: orderflow
    password: orderflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        acks: all
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 10000
        delivery.timeout.ms: 15000
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.rom.orderflow.order.kafka.event.WorkflowEvent
        spring.json.trusted.packages: com.rom.orderflow.order.kafka.event
    listener:
      ack-mode: record

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

orderflow:
  outbox:
    batch-size: 10
    publish-delay-ms: 2000
    processing-timeout-seconds: 120
    max-attempts: 5
  saga:
    step-timeout-seconds: 120
    recovery-delay-ms: 5000
    max-retries: 5
